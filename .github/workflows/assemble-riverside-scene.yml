name: Assemble Southern Song riverside scene
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scene.js'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the already verified two-model artifact
        uses: actions/download-artifact@v4
        with:
          name: lux3d-batch1-models
          path: incoming
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44298869796
      - name: Install models into the scene asset paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/3d/bridges public/assets/3d/architecture
          find incoming -type f -name 'timber-arch-bridge.glb' -exec cp {} public/assets/3d/bridges/timber-arch-bridge.glb \;
          find incoming -type f -name 'wharf-dock.glb' -exec cp {} public/assets/3d/architecture/wharf-dock.glb \;
          test -s public/assets/3d/bridges/timber-arch-bridge.glb
          test -s public/assets/3d/architecture/wharf-dock.glb
          python - <<'PY'
          import struct
          from pathlib import Path
          for p in [Path('public/assets/3d/bridges/timber-arch-bridge.glb'),Path('public/assets/3d/architecture/wharf-dock.glb')]:
              b=p.read_bytes()
              assert b[:4]==b'glTF' and struct.unpack_from('<I',b,4)[0]==2 and struct.unpack_from('<I',b,8)[0]==len(b)
              print('GLB OK',p,len(b))
          PY
      - name: Commit the two binary models
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/3d/bridges/timber-arch-bridge.glb public/assets/3d/architecture/wharf-dock.glb
          if git diff --cached --quiet; then echo 'No model changes'; exit 0; fi
          git commit -m 'Add verified bridge and wharf models to riverside scene'
          git push
