name: Muse Blender - Qingming asset inspection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qingming-muse-blender
  cancel-in-progress: false

jobs:
  inspect-and-render:
    runs-on: [self-hosted, linux, x64, blender]
    timeout-minutes: 45
    steps:
      - name: Check out project scripts
        uses: actions/checkout@v4

      - name: Verify Muse Blender and source assets
        env:
          ASSET_ROOT: /home/hatch/workspace/qingming/public/assets/3d
        run: |
          /home/hatch/workspace/blender/blender --version
          test -d "$ASSET_ROOT"
          find "$ASSET_ROOT" -maxdepth 3 -type f \( -name '*.glb' -o -name '*.glb.gz' \) -printf '%p %s bytes\n' | sort
          for f in \
            bridges/timber-arch-bridge.glb \
            bridges/stone-arch-bridge.glb \
            architecture/riverside-commercial-building.glb \
            architecture/teahouse.glb \
            architecture/wharf-dock.glb; do
            test -s "$ASSET_ROOT/$f" || { echo "Missing asset: $ASSET_ROOT/$f"; exit 1; }
          done
          test -s "$ASSET_ROOT/architecture/restaurant-wine-house.glb" -o -s "$ASSET_ROOT/architecture/restaurant-wine-house.glb.gz"

      - name: Prepare compressed wine-house model
        env:
          ASSET_ROOT: /home/hatch/workspace/qingming/public/assets/3d
        run: |
          if [ -s "$ASSET_ROOT/architecture/restaurant-wine-house.glb" ]; then
            cp "$ASSET_ROOT/architecture/restaurant-wine-house.glb" /tmp/restaurant-wine-house.glb
          else
            gzip -dc "$ASSET_ROOT/architecture/restaurant-wine-house.glb.gz" > /tmp/restaurant-wine-house.glb
          fi
          test -s /tmp/restaurant-wine-house.glb
          stat -c '%n %s bytes' /tmp/restaurant-wine-house.glb

      - name: Render six assets under Song-painting light
        env:
          QINGMING_ASSET_ROOT: /home/hatch/workspace/qingming/public/assets/3d
        run: |
          mkdir -p output
          /home/hatch/workspace/blender/blender --background --factory-startup --python-exit-code 1 --python scripts/blender_cloud_preview.py

      - name: Upload Blender preview and project
        uses: actions/upload-artifact@v4
        with:
          name: qingming-muse-blender-inspection
          path: |
            output/qingming-assets-overview.png
            output/qingming-assets.blend
            output/model-dimensions.json
          if-no-files-found: error
          retention-days: 14
