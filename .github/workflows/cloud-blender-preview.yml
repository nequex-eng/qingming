name: Cloud Blender - Qingming Asset Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Import and render six GLB assets
        run: |
          mkdir -p cloud-blender-output
          blender --background --factory-startup --python-exit-code 1 --python scripts/cloud_blender_preview.py

      - name: Upload Blender preview and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: qingming-cloud-blender-preview
          path: |
            cloud-blender-output/
          if-no-files-found: error
          retention-days: 14
