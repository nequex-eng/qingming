name: Import batch4 river and ground materials
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-batch4-environment.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the two updated environment models
        run: |
          set -euo pipefail
          mkdir -p /tmp/batch4 public/assets/3d/environment
          curl -fL --retry 3 'https://github.com/user-attachments/files/35076486/6.zip' -o /tmp/batch4/river.zip
          curl -fL --retry 3 'https://github.com/user-attachments/files/35075982/Archive.2.zip' -o /tmp/batch4/ground.zip
          unzip -p /tmp/batch4/river.zip river.glb > public/assets/3d/environment/river.glb
          unzip -p /tmp/batch4/ground.zip ground.glb > public/assets/3d/environment/ground.glb
      - name: Inspect and update environment asset catalog
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          root=Path('public/assets/3d/environment')
          for name in ('river','ground'):
              data=(root/f'{name}.glb').read_bytes()
              magic,version,length=struct.unpack_from('<4sII',data,0)
              chunk_len,chunk_type=struct.unpack_from('<II',data,12)
              doc=json.loads(data[20:20+chunk_len].decode('utf-8'))
              print(name, {'bytes':len(data),'version':version,'meshes':len(doc.get('meshes',[])),'materials':[m.get('name','') for m in doc.get('materials',[])],'nodes':[n.get('name','') for n in doc.get('nodes',[])[:16]]})
              assert magic==b'glTF' and version==2 and length==len(data)
          p=Path('public/assets/3d/asset-catalog-batch3.json')
          catalog=json.loads(p.read_text())
          for item in catalog:
              if item['id'] in ('river','ground'):
                  item['size_bytes']=(root/(item['id']+'.glb')).stat().st_size
                  item['format']='GLB 2.0 · batch4 replacement'
                  item['batch']='batch4'
          p.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit imported batch4 materials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/3d/environment/river.glb public/assets/3d/environment/ground.glb public/assets/3d/asset-catalog-batch3.json
          if git diff --cached --quiet; then echo 'No material changes'; exit 0; fi
          git commit -m 'Import batch4 river and ground materials'
          git push
