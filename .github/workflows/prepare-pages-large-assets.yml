name: Prepare compressed large GLB for Pages

on:
  push:
    paths:
      - 'scene.js'
      - '.github/workflows/prepare-pages-large-assets.yml'

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace oversized Pages asset with verified gzip payload
        shell: bash
        run: |
          set -euo pipefail
          url='https://qingming-assets.pages.dev/restaurant-wine-house.glb.gz'
          curl -fL --retry 3 --retry-delay 2 "$url" -o /tmp/restaurant-wine-house.glb.gz
          gzip -dc /tmp/restaurant-wine-house.glb.gz > /tmp/restaurant-wine-house.glb
          python - <<'PY'
          import hashlib, os, struct
          p='/tmp/restaurant-wine-house.glb'
          b=open(p,'rb').read(12)
          assert b[:4]==b'glTF' and struct.unpack('<I',b[4:8])[0]==2 and struct.unpack('<I',b[8:12])[0]==os.path.getsize(p)
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          expected='6c45e3bda4b66533c97b8d72c3091d617eea3f7f07503af56ced43c06028bf64'
          assert h==expected, f'Unexpected source model hash: {h}'
          print('Verified restaurant GLB SHA256',h,'size',os.path.getsize(p))
          gz='/tmp/restaurant-wine-house.glb.gz'
          print('Compressed size',os.path.getsize(gz))
          assert os.path.getsize(gz)<25*1024*1024, 'Compressed file still exceeds Pages 25 MiB limit'
          PY
          mkdir -p public/assets/3d/architecture
          cp /tmp/restaurant-wine-house.glb.gz public/assets/3d/architecture/restaurant-wine-house.glb.gz
          rm public/assets/3d/architecture/restaurant-wine-house.glb
      - name: Commit compressed Pages asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/assets/3d/architecture/restaurant-wine-house.glb public/assets/3d/architecture/restaurant-wine-house.glb.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Compress wine house GLB for Cloudflare Pages asset limit'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
