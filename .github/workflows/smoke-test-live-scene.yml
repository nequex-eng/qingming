name: Smoke test Qingming live 3D scene
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-test-live-scene.yml'
      - 'scene.js'
      - 'public/assets/manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify live game and all six GLB loads
        shell: bash
        run: |
          set -euo pipefail
          cat > ./smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--ignore-gpu-blocklist','--disable-dev-shm-usage']
            });
            const page = await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            const errors=[];
            const loaded=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text());});
            page.on('requestfailed',r=>errors.push('requestfailed: '+r.url()+' '+r.failure()?.errorText));
            page.on('response',r=>{if(r.url().includes('qingming-assets.pages.dev'))loaded.push({url:r.url(),status:r.status(),bytes:r.headers()['content-length']||''});});
            const base='https://qingming-riverside-2wq.pages.dev';
            let deployed=false; for(let i=0;i<36;i++){const r=await page.request.get(base+'/scene.js'); if(r.ok()&&(await r.text()).includes('DRACOLoader')){deployed=true;break;} await page.waitForTimeout(5000);} if(!deployed)throw new Error('Latest Draco-enabled scene.js is not deployed yet');
            const manifest=await page.request.get(base+'/public/assets/manifest.json');
            if(!manifest.ok()) throw new Error('Manifest HTTP '+manifest.status());
            const data=await manifest.json();
            if(!Array.isArray(data.assets)||data.assets.length!==6)throw new Error('Expected 6 manifest entries');
            await page.goto(base+'/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#status')?.textContent.includes('六种独立资产全部载入'),null,{timeout:120000}).catch(async e=>{const st=await page.locator('#status').innerText().catch(()=>'<missing status>');console.log('LOAD_TIMEOUT_STATUS '+st);console.log('LOAD_TIMEOUT_CDN '+JSON.stringify(loaded));console.log('LOAD_TIMEOUT_ERRORS '+JSON.stringify(errors));await page.screenshot({path:'./qingming-live-smoke.png',fullPage:true}).catch(()=>{});throw e;});
            await page.waitForTimeout(2500);
            const status=await page.locator('#status').innerText();
            const canvas=await page.locator('canvas').count();
            const geometry=await page.evaluate(()=>window.__qingmingLoadedModels.map(x=>({label:x.label,size:[x.size.x,x.size.y,x.size.z],minY:x.bounds.min.y,centerX:(x.bounds.min.x+x.bounds.max.x)/2,centerZ:(x.bounds.min.z+x.bounds.max.z)/2,expectedPosition:x.expectedPosition,appliedScale:x.appliedScale})));
            const result={status,canvas,geometry,cdnResponses:loaded,errors};
            console.log('SMOKE_RESULT '+JSON.stringify(result));
            await page.screenshot({path:'./qingming-live-smoke.png',fullPage:true,timeout:8000,animations:'disabled'}).catch(e=>console.log('SCREENSHOT_SKIPPED '+e.message));
            if(canvas!==1)throw new Error('Expected one WebGL canvas');
            if(geometry.length!==6)throw new Error('Expected six parsed GLB models, got '+geometry.length);
            for(const x of geometry){if(!x.size.every(v=>Number.isFinite(v)&&v>0))throw new Error('Invalid model dimensions: '+x.label);if(Math.abs(x.minY-x.expectedPosition[1])>0.05)throw new Error('Ground contact changed: '+x.label);if(Math.abs(x.centerX-x.expectedPosition[0])>0.05||Math.abs(x.centerZ-x.expectedPosition[2])>0.05)throw new Error('Model placement changed: '+x.label);if(!(x.appliedScale>0&&Number.isFinite(x.appliedScale)))throw new Error('Invalid applied scale: '+x.label);}
            if(loaded.filter(x=>x.status===200).length<6)throw new Error('Not all six CDN GLBs returned HTTP 200');
            if(errors.length)throw new Error('Browser errors detected: '+errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          JS
          node ./smoke.cjs
      - name: Upload live scene screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingming-live-scene-smoke
          path: qingming-live-smoke.png
          if-no-files-found: ignore
          retention-days: 7
