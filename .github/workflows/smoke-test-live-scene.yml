name: Smoke test Qingming pixel game
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-test-live-scene.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install chromium
      - name: Test desktop and mobile gameplay
        run: |
          cat > smoke.cjs <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const errors=[];
            const page=await browser.newPage({viewport:{width:1280,height:800}});
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://qingming-riverside-2wq.pages.dev/',{waitUntil:'networkidle'});
            await page.waitForTimeout(700);
            if(!(await page.title()).includes('像素市井'))throw new Error('Pixel game title missing');
            if(await page.locator('canvas').count()!==1)throw new Error('Canvas missing');
            const before=await page.evaluate(()=>window.__bianheState.x);
            await page.keyboard.down('d');await page.waitForTimeout(700);await page.keyboard.up('d');
            const after=await page.evaluate(()=>JSON.parse(localStorage.getItem('bianhe-pixel-save')).x);
            if(!(after>before))throw new Error('Keyboard movement failed');
            await page.locator('#bag').click();
            if(await page.locator('#panel').isHidden())throw new Error('Inventory panel did not open');
            await page.locator('#close').click();
            await page.locator('#orders').click();
            if(await page.locator('#panel').isHidden())throw new Error('Orders panel did not open');
            await page.locator('#close').click();
            await page.screenshot({path:'pixel-game-desktop.png'});
            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await mobile.goto('https://qingming-riverside-2wq.pages.dev/',{waitUntil:'networkidle'});
            if(await mobile.locator('#mobile').isHidden())throw new Error('Mobile joystick is hidden');
            await mobile.screenshot({path:'pixel-game-mobile.png'});
            if(errors.length)throw new Error(errors.join(' | '));
            console.log('PIXEL_GAME_SMOKE_OK '+JSON.stringify({title:await page.title(),desktopCanvas:await page.locator('canvas').count(),mobileJoystick:await mobile.locator('#mobile').isVisible(),movement:{before,after},errors}));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qingming-pixel-game-smoke
          path: pixel-game-*.png
          if-no-files-found: ignore
          retention-days: 7
